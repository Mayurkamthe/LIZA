name: Build JARVIS APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"

          curl -L -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q commandlinetools.zip
          mv cmdline-tools latest

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Environment check
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== ANDROID SDK ====="
          sdkmanager --list_installed

      - name: Check Android project
        working-directory: android
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f | sort

          echo "===== GRADLE TASKS ====="
          gradle tasks --no-daemon --stacktrace

      - name: Build JARVIS APK
        working-directory: android
        run: |
          set +e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "           BUILD DIAGNOSTICS"
          echo "========================================"

          echo ""
          echo "===== WHAT WENT WRONG ====="
          grep -n -A 30 -B 5 "What went wrong" build.log || true

          echo ""
          echo "===== EXECUTION FAILED ====="
          grep -n -A 15 -B 5 "Execution failed" build.log || true

          echo ""
          echo "===== CAUSED BY ====="
          grep -n -A 15 -B 3 "Caused by:" build.log | head -100 || true

          echo ""
          echo "===== LAST 100 LINES ====="
          tail -100 build.log

          exit $BUILD_EXIT

      - name: Verify APK
        run: |
          echo "===== APK FILES ====="
          find android/app/build/outputs -type f -name "*.apk" -ls

          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
